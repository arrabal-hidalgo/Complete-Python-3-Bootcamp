[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "segittur-commons"
version = "0.2.4"
description = "Segittur-Commons is a Python package that provides common utilities and components for SEGITTUR projects."
authors = [
  { name = "Alejandro Arrabal Hidalgo", email = "alejandro.arrabal@sngular.com" },
  { name = "Sofía Cerdá Muñoz", email = "sofia.cerda@sngular.com" },  
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "langchain-core (>=0.3.29,<0.4.0)",
    "langchain-openai (>=0.3.0,<0.4.0)",
    "langchain-text-splitters (>=0.3.6,<0.4.0)",
    "langchain-milvus (>=0.1.10,<0.2.0)",
    "typer (>=0.15.1,<0.16.0)",
    "pymilvus (>=2.5.7,<2.6.0)",
    "azure-storage-blob (>=12.25.1,<12.26.0)",
    "azure-identity (>=1.23.0,<1.24.0)",
    "minio (>=7.2.15,<7.3.0)"
]

[tool.poetry]
package-mode = true
packages = [{ include = "segittur_commons" }]

[tool.poetry.group.dev.dependencies]
black = "~25.1"
pylint = "~3.3"
coverage = "~7.6"
pytest = "~8.3"
pytest-cov = "~6.1"
pytest-asyncio = "~0.25"
factory-boy = "~3.3"
pip-audit = "~2.9"

[tool.black]
line-length = 100
exclude = '''
(
  /(
    | \.git          # root of the project
  )/
)
'''

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = [ "tests" ]