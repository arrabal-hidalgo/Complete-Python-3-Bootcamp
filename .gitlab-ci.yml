# Este pipeline de GitLab CI/CD se encarga de construir y publicar
# el paquete Python en el Package Registry de GitLab.

stages:
  - analysis
  - testing
  - deploy

variables:
  IMAGE_NAME: "segittur-commons"
  DOCKER_DRIVER: overlay2
  TEST_IMAGE_TAG: test-$CI_COMMIT_SHORT_SHA

code_quality:
  stage: analysis
  image: python:3.11
  # tags:
  #  - daiot-cluster
  before_script:
    - pip install ruff mypy black types-requests
  script:
    - black --check segittur_commons/app
    - ruff check segittur_commons/app
    - mypy segittur_commons/app
  only:
    - branches
    - merge_requests

code_security:
  stage: analysis
  image: python:3.11
  # tags:
  #  - daiot-cluster
  before_script:
    - pip install bandit
  script:
    - bandit -r segittur_commons/app
  only:
    - branches
    - merge_requests

dependencies_security:
  stage: analysis
  image: docker:dind-rootless 
  # tags:
  #  - daiot-cluster
  before_script:
    - dockerd-entrypoint.sh & sleep 10
    - export DOCKER_HOST=unix:///run/user/1000/docker.sock
    - docker version
  script:
    - echo "Building Docker Image to test $IMAGE_NAME:$TEST_IMAGE_TAG"
    - docker build --target commons -t $IMAGE_NAME:$TEST_IMAGE_TAG -f .devcontainer/Dockerfile .
    - docker run --env-file .env_template --rm $IMAGE_NAME:$TEST_IMAGE_TAG /usr/local/segittur_commons/.venv/bin/pip-audit --cache-dir /tmp
  only:
    - branches
    - merge_requests
  allow_failure: true

unit_tests:
  stage: testing
  image: python:3.11
  # tags:
  #  - daiot-cluster
  when: always
  variables:
    PIP_ROOT_USER_ACTION: ignore
    POETRY_HOME: "/opt/poetry"
    POETRY_VIRTUALENVS_CREATE: false
  before_script:
    - pip install pytest pytest-cov poetry
    - export PATH="$POETRY_HOME/bin:$PATH"
    - poetry install
  script:
    - pytest --cov --cov-report term --cov-report xml:coverage.xml --junitxml=report.xml --cov-config=.coveragerc tests/unit
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    paths:
      - report.xml
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  only:
    - branches
    - merge_requests

build-and-publish:
  stage: deploy
  image: python:3.11-slim
  # tags:
  #  - daiot-cluster
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Iniciando la construcción y publicación para el tag ${CI_COMMIT_TAG}"
    - pip install poetry
    - |
      TAG_VERSION=$(echo "${CI_COMMIT_TAG}" | sed 's/^v//')
      POETRY_VERSION=$(poetry version --short)
      echo "Comprobando versiones: Tag Git ('${TAG_VERSION}') vs pyproject.toml ('${POETRY_VERSION}')"
      if [ "${TAG_VERSION}" != "${POETRY_VERSION}" ]; then
        echo "Error: La versión del tag (${TAG_VERSION}) no coincide con la versión de poetry (${POETRY_VERSION})."
        exit 1
      fi
    - poetry build
    - poetry config repositories.gitlab ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi
    - poetry config http-basic.gitlab gitlab-ci-token ${CI_JOB_TOKEN}
    - poetry publish -r gitlab
    - echo "Paquete publicado correctamente en el Package Registry de GitLab."
