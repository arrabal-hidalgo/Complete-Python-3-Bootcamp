# Este pipeline de GitLab CI/CD se encarga de construir y publicar
# el paquete Python en el Package Registry de GitLab.

stages:
  - analysis
  - testing
  - deploy

variables:
  IMAGE_NAME: "segittur-commons"
  DOCKER_DRIVER: overlay2
  TEST_IMAGE_TAG: test-$CI_COMMIT_SHORT_SHA

code_quality:
  stage: analysis
  image: python:3.12
  # tags:
  #  - daiot-cluster
  before_script:
    - pip install ruff mypy black types-requests
  script:
    - black --check segittur_commons/app
    - ruff check segittur_commons/app
    - mypy segittur_commons/app
  only:
    - branches
    - merge_requests

code_security:
  stage: analysis
  image: python:3.12
  # tags:
  #  - daiot-cluster
  before_script:
    - pip install bandit
  script:
    - bandit -r segittur_commons/app
  only:
    - branches
    - merge_requests

dependencies_security:
  stage: analysis
  image: docker:dind-rootless 
  # tags:
  #  - daiot-cluster
  before_script:
    - dockerd-entrypoint.sh & sleep 10
    - export DOCKER_HOST=unix:///run/user/1000/docker.sock
    - docker version
  script:
    - echo "Building Docker Image to test $IMAGE_NAME:$TEST_IMAGE_TAG"
    - docker build --target commons -t $IMAGE_NAME:$TEST_IMAGE_TAG -f .devcontainer/Dockerfile .
    - docker run --env-file .env_template --rm $IMAGE_NAME:$TEST_IMAGE_TAG /usr/local/segittur_commons/.venv/bin/pip-audit --cache-dir /tmp
  only:
    - branches
    - merge_requests
  allow_failure: true

unit_tests:
  stage: testing
  image: python:3.12
  # tags:
  #  - daiot-cluster
  when: always
  variables:
    PIP_ROOT_USER_ACTION: ignore
    POETRY_HOME: "/opt/poetry"
    POETRY_VIRTUALENVS_CREATE: false
  before_script:
    - pip install pytest pytest-cov poetry
    - export PATH="$POETRY_HOME/bin:$PATH"
    - poetry install
  script:
    - pytest --cov --cov-report term --cov-report xml:coverage.xml --junitxml=report.xml --cov-config=.coveragerc tests/unit
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    paths:
      - report.xml
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  only:
    - branches
    - merge_requests

build-and-publish:
  stage: deploy
  image: python:3.12-slim
  # tags:
  #  - daiot-cluster
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - pip install poetry
    - |
      TAG_VERSION=$(echo "${CI_COMMIT_TAG}" | sed 's/^v//')
      POETRY_VERSION=$(poetry version --short)
      echo "Checking version: Tag Git ('${TAG_VERSION}') vs pyproject.toml ('${POETRY_VERSION}')"
      if [ "${TAG_VERSION}" != "${POETRY_VERSION}" ]; then
        echo "Error: The tag version (${TAG_VERSION}) doesn't match with poetry versión de poetry (${POETRY_VERSION})."
        exit 1
      fi
    - poetry build
    - poetry config repositories.gitlab ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi
    - poetry config http-basic.gitlab gitlab-ci-token ${CI_JOB_TOKEN}
    - poetry publish -r gitlab
    - echo "Package was published properly into Gitlab Registry Package"

publish-oci:
  stage: deploy
  image: python:3.12-slim
  # tags:
  #  - daiot-cluster
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - pip install poetry
    - |
      ORAS_VERSION="1.1.0"
      echo "Getting oras..."
      curl -sL -o oras.tar.gz "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
      mkdir -p oras-install/
      tar -zxf oras.tar.gz -C oras-install/
      mv oras-install/oras /usr/local/bin/
      rm -rf oras.tar.gz oras-install/
  script:
    - |
      TAG_VERSION=$(echo "${CI_COMMIT_TAG}" | sed 's/^v//')
      POETRY_VERSION=$(poetry version --short)
      echo "Checking versions: Tag Git ('${TAG_VERSION}') vs pyproject.toml ('${POETRY_VERSION}')"
      if [ "${TAG_VERSION}" != "${POETRY_VERSION}" ]; then
        echo "Error: The tag version (${TAG_VERSION}) doesn't match with poetry version (${POETRY_VERSION})."
        exit 1
      fi
    - poetry build
    - oras login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - echo "Publishing package into OCI registry..."
    - |
      TAG_VERSION=$(echo "${CI_COMMIT_TAG}" | sed 's/^v//')
      oras push "$CI_REGISTRY_IMAGE/${IMAGE_NAME}:${TAG_VERSION}" dist/*
    - echo "Package was published properly into OCI Registry Package"