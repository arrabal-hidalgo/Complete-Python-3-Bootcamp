# Este pipeline de GitLab CI/CD se encarga de construir y publicar
# el paquete Python en el Package Registry de GitLab.

stages:
  - prepare
  - analysis
  - testing
  - cleanup
  - deploy

variables:
  PACKAGE_NAME: segittur_commons
  IMAGE_NAME: segittur-commons
  TEST_IMAGE_TAG: test-$CI_COMMIT_SHORT_SHA
  GITLAB_TEST_IMAGE: $CI_REGISTRY_IMAGE:$TEST_IMAGE_TAG
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

# --- ANCHORS ---

.docker_gitlab_login: &docker_gitlab_login
  - echo "Logging into GitLab Container Registry"
  - echo "$CI_JOB_TOKEN" | docker login $CI_REGISTRY -u gitlab-ci-token --password-stdin

.pull_gitlab_test_image: &pull_gitlab_test_image
  - *docker_gitlab_login
  - echo "📥 Pulling image $GITLAB_TEST_IMAGE from GitLab Registry"
  - docker pull $GITLAB_TEST_IMAGE

.oras_setup: &oras_setup |
  ORAS_VERSION="1.3.0"
  echo "Getting oras..."
  curl -sL -o oras.tar.gz "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
  mkdir -p oras-install/
  tar -zxf oras.tar.gz -C oras-install/
  mv oras-install/oras /usr/local/bin/
  rm -rf oras.tar.gz oras-install/

# --- TEMPLATES ---

.dind_service:
  image: docker:latest
  services:
    - name: docker:dind
      command: 
        - "--tls=false"
        - "--host=tcp://0.0.0.0:2375"
        - "--storage-driver=overlay2"
        - "--max-concurrent-uploads=2"

# --- STAGE: prepare ---

prepare_test_image:
  stage: prepare
  extends: .dind_service
  before_script:
    - sleep 5
    - docker version
  script:
    - *docker_gitlab_login
    - echo "🏗️ Building Docker Image to test ONCE $GITLAB_TEST_IMAGE"
    - docker build --target common-test -t $GITLAB_TEST_IMAGE -f .devcontainer/Dockerfile .
    - echo "Pushing to GitLab Registry"
    - docker push $GITLAB_TEST_IMAGE
  rules:
    - if: '$CI_MERGE_REQUEST_ID'
    - if: '$CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'

# --- STAGE: analysis ---

code_quality:
  stage: analysis
  extends: .dind_service
  needs: ["prepare_test_image"]
  before_script:
    - *pull_gitlab_test_image
  script:
    - echo "🔍 Running code quality checks inside the container"
    - |
      docker run --rm $GITLAB_TEST_IMAGE /bin/sh -c "
        echo '--- Black ---' && black --check segittur_commons/app && \
        echo '--- Ruff ---' && ruff check segittur_commons/app && \
        echo '--- MyPy ---' && mypy segittur_commons/app
      "
  rules:
    - if: '$CI_MERGE_REQUEST_ID'
    - if: '$CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'

code_security:
  stage: analysis
  extends: .dind_service
  needs: ["prepare_test_image"]
  before_script:
    - *pull_gitlab_test_image
  script:
    - echo "🛡️ Running security checks inside the container"
    - docker run --rm $GITLAB_TEST_IMAGE bandit -r segittur_commons/app
  rules:
    - if: '$CI_MERGE_REQUEST_ID'
    - if: '$CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'

dependencies_security:
  stage: analysis
  extends: .dind_service
  needs: ["prepare_test_image"]
  before_script:
    - *pull_gitlab_test_image
  script:
    - echo "🛡️ Running security dependencies checks inside the container"
    - docker run --env-file .env.template --rm $GITLAB_TEST_IMAGE pip-audit --cache-dir /tmp
  rules:
    - if: '$CI_MERGE_REQUEST_ID'
    - if: '$CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'
  allow_failure: true

# --- STAGE: testing ---

unit_tests:
  stage: testing
  extends: .dind_service
  needs: ["prepare_test_image"]
  before_script:
    - *pull_gitlab_test_image
  script:
    - echo "🚀 Launching unit tests"
    - docker run --env-file .env.template --rm $GITLAB_TEST_IMAGE pytest --cov --cov-report term --cov-report xml:coverage.xml --junitxml=report.xml --cov-config=.coveragerc tests/unit
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    expire_in: 1 week
    when: always
    paths:
      - report.xml
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  rules:
    - if: '$CI_MERGE_REQUEST_ID'
    - if: '$CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'

# --- STAGE: cleanup ---

cleanup_gitlab:
  stage: cleanup
  image: quay.io/skopeo/stable
  needs: ["unit_tests", "code_quality", "code_security", "dependencies_security"]
  when: always
  variables:
    GIT_STRATEGY: none
  script:
    - skopeo login --username gitlab-ci-token --password $CI_JOB_TOKEN $CI_REGISTRY
    - |
      echo "🔍 Checking if image $GITLAB_TEST_IMAGE exists in Gitlab Container Registry"
      if skopeo inspect docker://$GITLAB_TEST_IMAGE > /dev/null 2>&1; then
        echo "✅ Image tag found. Proceeding to delete."
        skopeo delete docker://$GITLAB_TEST_IMAGE
      else
        echo "⚠️ Image tag not found. Nothing to cleanup."
      fi
  rules:
    - if: '$CI_MERGE_REQUEST_ID'
    - if: '$CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'

# --- STAGE: deploy ---

build_package:
  stage: deploy
  image: python:3.12-slim
  script:
    - pip install poetry
    - |
      TAG_VERSION=$(echo "${CI_COMMIT_TAG}" | sed 's/^v//')
      POETRY_VERSION=$(poetry version --short)
      echo "Checking versions: Tag Git ('${TAG_VERSION}') vs pyproject.toml ('${POETRY_VERSION}')"
      if [ "${TAG_VERSION}" != "${POETRY_VERSION}" ]; then
        echo "Error: The tag version (${TAG_VERSION}) doesn't match with poetry version (${POETRY_VERSION})."
        exit 1
      fi
    - echo "🏗️ Building Distribution Package ..."
    - poetry build
  artifacts:
    expire_in: 1 day
    paths:
      - dist/
  rules:
    - if: $CI_COMMIT_TAG

publish_gitlab:
  stage: deploy
  image: python:3.12-slim
  needs: ["build_package"] # Recibe la carpeta 'dist/'
  script:
    - pip install poetry
    - echo "📦 Publishing to Gitlab Registry Package..."
    - poetry config repositories.gitlab ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi
    - poetry config http-basic.gitlab gitlab-ci-token ${CI_JOB_TOKEN}
    - poetry publish -r gitlab # Usamos los archivos pre-construidos en 'dist'
  rules:
    - if: $CI_COMMIT_TAG

publish_oci:
  stage: deploy
  image: python:3.12
  needs: ["build_package"] # Recibe la carpeta 'dist/'
  before_script:
    - *oras_setup
  script:
    - echo $AZURE_REGISTRY_PASSWORD | oras login $AZURE_REGISTRY -u $AZURE_REGISTRY_USER --password-stdin
    - TAG_VERSION="${CI_COMMIT_TAG#v}"
    - echo "📦 Publishing package into OCI registry (Azure)..."
    - |
      cd dist
      WHEEL_FILE=$(ls ${PACKAGE_NAME}-${TAG_VERSION}*.whl)
      TAR_FILE=$(ls ${PACKAGE_NAME}-${TAG_VERSION}*.tar.gz)
      oras push "$AZURE_REGISTRY/${IMAGE_NAME}:${TAG_VERSION}" \
        --artifact-type application/vnd.myproject.python-package \
        --annotation org.opencontainers.image.version="${TAG_VERSION}" \
        --annotation "${WHEEL_FILE}"="type=wheel" \
        --annotation "${TAR_FILE}"="type=sdist" \
        "${WHEEL_FILE}:${WHEEL_FILE}" \
        "${TAR_FILE}:${TAR_FILE}"
  rules:
    - if: $CI_COMMIT_TAG