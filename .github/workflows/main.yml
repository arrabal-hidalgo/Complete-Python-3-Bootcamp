name: Segittur commons package

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'

jobs:
  #sonarqube:
  #  uses: SEGITTURPIDPIA/app-pid-devops-templates/.github/workflows/PRU-sonarqube.yml@main
  #  if: github.ref == 'refs/heads/develop'
  #  secrets: inherit
  #  with:
  #    runs_on: pid
  #    container_image: ${{ vars.SP_ACR_PRU_NAME }}/sonarqube-actions-tools:1.0.0
  #    sonar_host_url: ${{ vars.SONAR_HOST_URL }}
  #    branch_name: ${{ github.ref_name }}

  build-and-push:
  #  needs: sonarqube
    if: startsWith(github.ref, 'refs/tags/')

    runs-on: pid

    name: OCI Package Build & Publish

    steps:
      - name: Fix workspace permissions
        run: sudo chown -R $(id -u):$(id -g) "$GITHUB_WORKSPACE"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install poetry
      - run: poetry build
     
      - name: OCI Package publish
        uses: oras-project/setup-oras@v1
        with:
          version: 1.3.0
      - run: echo "${{ secrets.SP_ACR_PRU_SECRET }}"  | oras login ${{ secrets.SP_ACR_PRU_NAME }} -u "${{ secrets.SP_ACR_APP_PRU_ID }}" --password-stdin
      - run: ora version